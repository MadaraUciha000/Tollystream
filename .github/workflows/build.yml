name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Prepare Builds Branch
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds/.git" ]; then
            rm -rf "$GITHUB_WORKSPACE/builds"
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init -q
            git checkout -q -b builds
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old builds
        run: |
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true
          rm -f $GITHUB_WORKSPACE/builds/plugins.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon
          find . -name '*.cs3' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          find . -name 'plugins.json' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          sed "s|REPO|${GITHUB_REPOSITORY}|g" repo.json > $GITHUB_WORKSPACE/builds/repo.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "Build $GITHUB_SHA" || true
            git push origin builds --force
          else
            echo "No changes to push"
          fi
